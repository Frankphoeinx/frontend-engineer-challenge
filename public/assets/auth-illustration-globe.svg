<svg width="480" height="480" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="-20" y="-20" width="520" height="520">
    <div
      xmlns="http://www.w3.org/1999/xhtml"
      style="backdrop-filter:blur(10px);clip-path:url(#bgblur_clip_path);height:100%;width:100%"
    ></div>
  </foreignObject>
  <g data-figma-bg-blur-radius="20">
    <circle cx="240" cy="240" r="240" fill="url(#paint0_radial)" fill-opacity="0.8" />
    <circle cx="240" cy="240" r="240" fill="url(#paint1_radial)" fill-opacity="0.2" />
  </g>
  <mask id="mask0" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="480">
    <circle cx="240" cy="240" r="240" fill="#D9D9D9" />
  </mask>
  <g mask="url(#mask0)">
    <g filter="url(#filter1_f)">
      <circle
        cx="240"
        cy="240"
        r="240"
        transform="rotate(-30 240 240)"
        stroke="url(#paint2_linear)"
        stroke-opacity="0.75"
        stroke-width="24"
      />
    </g>
  </g>
  <defs>
    <clipPath id="bgblur_clip_path" transform="translate(20 20)">
      <circle cx="240" cy="240" r="240" />
    </clipPath>
    <filter
      id="filter1_f"
      x="-44.042"
      y="-44.042"
      width="568.084"
      height="568.084"
      filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feFlood flood-opacity="0" result="BackgroundImageFix" />
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
      <feGaussianBlur stdDeviation="16" result="effect1_foregroundBlur" />
    </filter>
    <radialGradient
      id="paint0_radial"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(480 480) rotate(-135) scale(678.823)"
    >
      <stop offset="0.140625" stop-color="#F5F6F8" />
      <stop offset="0.854167" stop-color="#DCE0EA" />
    </radialGradient>
    <radialGradient
      id="paint1_radial"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(240 240) rotate(90) scale(240)"
    >
      <stop stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paint2_linear" x1="240" y1="0" x2="240" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0.75" />
    </linearGradient>
  </defs>
